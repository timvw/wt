name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: generate-token
        # Skip on fork PRs, where BOT_APP_ID is unavailable and
        # create-github-app-token would error on the empty client-id and emit a CI
        # annotation. `secrets` isn't allowed in `if`, so gate on the github context.
        # Downstream steps fall back to github.token when this step is skipped.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          # Windows-specific path and shell-detection behaviour is unit-tested
          # with GOOS injected, but only a Windows host proves the tests
          # themselves hold there — and that nothing assumes POSIX paths.
          - os: windows
            runner: windows-latest

    steps:
      - name: Generate GitHub App token
        id: generate-token
        # Skip on fork PRs, where BOT_APP_ID is unavailable and
        # create-github-app-token would error on the empty client-id and emit a CI
        # annotation. `secrets` isn't allowed in `if`, so gate on the github context.
        # Downstream steps fall back to github.token when this step is skipped.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      # The fish wrapper tests execute the generated integration script for
      # real and skip themselves when fish is absent, which the runners' default
      # image is. Without this the no-script(1) fallback (#131) is unit-tested
      # nowhere.
      - name: Install fish (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Run unit tests
        if: matrix.os == 'linux'
        run: go test -short -v -race -coverprofile=coverage.out ./...

      # No -race on Windows: it needs a cgo toolchain, and the value here is
      # running the suite on a Windows host, not race detection twice.
      - name: Run unit tests (Windows)
        if: matrix.os == 'windows'
        run: go test -short -v ./...

      # The suite above runs -short, which skips every PTY-driven test. The
      # prompt-visibility tests only mean anything when they actually drive a
      # terminal, so they are run explicitly. Windows is the platform #124 was
      # reported on: Git Bash ships no script(1), so the wrapper redirects
      # stdout to a file and a prompt written there is invisible.
      - name: Run prompt visibility tests (PTY, not -short)
        run: go test -v -run 'TestInteractivePromptVisibleWithoutScript|TestNavigationMarkerStaysOnStdout' ./cmd/

      - name: Upload coverage to Codecov
        if: matrix.os == 'linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: timvw/wt
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build and Cross-Compile
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Generate GitHub App token
        id: generate-token
        # Skip on fork PRs, where BOT_APP_ID is unavailable and
        # create-github-app-token would error on the empty client-id and emit a CI
        # annotation. `secrets` isn't allowed in `if`, so gate on the github context.
        # Downstream steps fall back to github.token when this step is skipped.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build for all platforms
        run: |
          mkdir -p bin
          # Native build
          go build -o bin/wt .
          # Cross-compile for all supported platforms
          GOOS=linux GOARCH=amd64 go build -o bin/wt-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o bin/wt-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o bin/wt-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o bin/wt-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o bin/wt-windows-amd64.exe .

      - name: Verify binaries
        run: |
          ./bin/wt --help
          ls -lh bin/
          file bin/*

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: wt-linux-amd64
          path: bin/wt-linux-amd64
          retention-days: 1

      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v7
        with:
          name: wt-darwin-arm64
          path: bin/wt-darwin-arm64
          retention-days: 1

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: wt-windows-amd64
          path: bin/wt-windows-amd64.exe
          retention-days: 1

  nix:
    name: Nix Flake Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build flake (runs sandboxed test suite)
        run: nix build .#wt -L

      - name: Smoke test
        run: ./result/bin/wt version

  # Unified E2E tests using YAML scenarios
  e2e:
    name: E2E (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: linux
            runner: ubuntu-latest
            shell: bash
            binary: wt-linux-amd64
          - os: linux
            runner: ubuntu-latest
            shell: zsh
            binary: wt-linux-amd64
          - os: linux
            runner: ubuntu-latest
            shell: fish
            binary: wt-linux-amd64
          # macOS
          - os: macos
            runner: macos-latest
            shell: bash
            binary: wt-darwin-arm64
          - os: macos
            runner: macos-latest
            shell: zsh
            binary: wt-darwin-arm64
          - os: macos
            runner: macos-latest
            shell: fish
            binary: wt-darwin-arm64
          # Windows
          - os: windows
            runner: windows-latest
            shell: powershell
            binary: wt-windows-amd64
          - os: windows
            runner: windows-latest
            shell: pwsh
            binary: wt-windows-amd64
          # Git Bash runs the same native wt.exe through the bash integration,
          # a combination neither the Linux nor the PowerShell legs cover.
          # That gap is what let #112 ship.
          - os: windows
            runner: windows-latest
            shell: bash
            binary: wt-windows-amd64

    steps:
      - name: Generate GitHub App token
        id: generate-token
        # Skip on fork PRs, where BOT_APP_ID is unavailable and
        # create-github-app-token would error on the empty client-id and emit a CI
        # annotation. `secrets` isn't allowed in `if`, so gate on the github context.
        # Downstream steps fall back to github.token when this step is skipped.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install zsh (Linux)
        if: matrix.os == 'linux' && matrix.shell == 'zsh'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install fish (Linux)
        if: matrix.os == 'linux' && matrix.shell == 'fish'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fish (macOS)
        if: matrix.os == 'macos' && matrix.shell == 'fish'
        run: |
          # Drop the preinstalled aws/tap (unrelated to fish) so Homebrew's
          # tap-trust check does not emit an "untrusted taps" warning annotation.
          brew untap aws/tap 2>/dev/null || true
          brew install fish

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: bin

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows'
        run: |
          mv bin/${{ matrix.binary }} bin/wt
          chmod +x bin/wt
          ./bin/wt --help

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows'
        run: |
          mv bin/${{ matrix.binary }}.exe bin/wt.exe
          ./bin/wt.exe --help

      - name: Run E2E tests
        if: matrix.os != 'windows'
        run: |
          go run e2e/run.go --wt=bin/wt --shells=${{ matrix.shell }}

      - name: Run E2E tests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          go run e2e/run.go --wt=bin/wt.exe --shells=${{ matrix.shell }}
