# E2E tests for `wt shellenv` command
name: shellenv
description: Test shell environment setup and validation

scenarios:
  - name: shellenv_produces_output
    description: shellenv command produces output
    skip_shellenv: true  # Run raw binary, don't source shellenv
    skip_shells: [powershell, pwsh, fish]  # fish's wrapper uses "function wt", not "wt()"
    steps:
      - run: $WT_BIN shellenv
        expect:
          exit_code: 0
          output_contains: "wt()"

  - name: shellenv_contains_wt_function
    description: shellenv output contains the wt wrapper function
    skip_shellenv: true
    steps:
      - run: $WT_BIN shellenv
        expect:
          output_contains: "navigating"

  - name: shellenv_bash_specific
    description: shellenv contains bash-specific code
    skip_shellenv: true
    skip_shells: [zsh, fish, powershell, pwsh]
    steps:
      - run: $WT_BIN shellenv
        expect:
          output_contains: "BASH_VERSION"

  - name: shellenv_zsh_specific
    description: shellenv contains zsh-specific code
    skip_shellenv: true
    skip_shells: [bash, fish, powershell, pwsh]
    steps:
      - run: $WT_BIN shellenv
        expect:
          output_contains: "ZSH_VERSION"

  - name: shellenv_powershell_specific
    description: shellenv contains PowerShell-specific code
    skip_shellenv: true
    skip_shells: [bash, zsh]
    steps:
      - run: $WT_BIN shellenv
        expect:
          output_contains: "function wt"

  # Regression test for #112. shellenv used to resolve the target shell from
  # GOOS alone, so `eval "$(wt shellenv)"` in .bashrc fed PowerShell code to
  # Git Bash.
  - name: shellenv_git_bash_outputs_bash_integration
    description: shellenv under Git Bash emits the bash wrapper, not PowerShell
    skip_shellenv: true
    skip_shells: [zsh, fish, powershell, pwsh]
    skip_os: [linux, darwin]
    steps:
      - run: $WT_BIN shellenv
        expect:
          exit_code: 0
          output_contains: "wt()"
      - run: $WT_BIN shellenv
        expect:
          output_not_contains: "Set-Location"

  - name: shellenv_uses_portable_sed
    description: shellenv uses portable sed syntax for completion (not gawk)
    skip_shellenv: true
    skip_shells: [powershell, pwsh]
    steps:
      - run: $WT_BIN shellenv
        expect:
          output_contains: "sed -n"
          output_not_contains: "match($0"

  - name: shellenv_completion_sed_works
    description: The sed command for branch extraction works correctly
    skip_shellenv: true
    skip_shells: [powershell, pwsh]
    steps:
      - run: |
          echo '/path/to/main  abc1234 [main]
          /path/to/feature  def5678 [feature-branch]' | tail -n +2 | sed -n 's/.*\[\([^]]*\)\].*/\1/p'
        expect:
          exit_code: 0
          output_contains: "feature-branch"

  - name: shellenv_includes_json_guard
    description: shellenv wrapper detects --format json and skips auto-cd
    skip_shellenv: true
    skip_shells: [powershell, pwsh]
    steps:
      - run: $WT_BIN shellenv
        expect:
          exit_code: 0
          output_contains: "--format=json"
      - run: $WT_BIN shellenv
        expect:
          output_contains: "--format json"

  - name: shellenv_propagates_failure_exit_code
    description: A failing wt command run through the wrapper exits non-zero
    # util-linux script(1) returns its own status unless --return is passed, so
    # without it the wrapper reported success for a failed command on Linux.
    skip_os: [windows]  # PowerShell exit code handling differs
    steps:
      - run: wt remove nonexistent-branch
        expect:
          exit_code: 1
          output_contains: "no worktree found for branch"

  - name: shellenv_success_after_failure_exit_code
    description: A successful command after a failing one still reports success
    skip_os: [windows]  # PowerShell exit code handling differs
    steps:
      - run: wt remove nonexistent-branch
        expect:
          exit_code: 1
      - run: wt list
        expect:
          exit_code: 0
          output_contains: "[main]"
