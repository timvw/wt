# E2E tests for `wt init` command
name: init
description: Test shell initialization command

scenarios:
  - name: init_bash_dry_run
    description: Init shows what would be added to bashrc
    skip_shellenv: true
    skip_shells: [zsh, powershell, pwsh]
    steps:
      - run: $WT_BIN init bash --dry-run
        expect:
          exit_code: 0
          output_contains: "wt initialize"

  - name: init_zsh_dry_run
    description: Init shows what would be added to zshrc
    skip_shellenv: true
    skip_shells: [bash, powershell, pwsh]
    steps:
      - run: $WT_BIN init zsh --dry-run
        expect:
          exit_code: 0
          output_contains: "wt initialize"

  - name: init_fish_dry_run
    description: Init shows what would be added to fish config.fish
    skip_shellenv: true
    skip_shells: [zsh, powershell, pwsh]
    steps:
      - run: $WT_BIN init fish --dry-run
        expect:
          exit_code: 0
          output_contains: "wt shellenv fish"

  - name: init_powershell_dry_run
    description: Init shows what would be added to PowerShell profile
    skip_shellenv: true
    skip_shells: [bash, zsh, fish]
    steps:
      - run: $WT_BIN init powershell --dry-run
        expect:
          exit_code: 0
          output_contains: "wt shellenv"

  # Regression test for #112. On Windows, init used to pick PowerShell from
  # GOOS alone, so under Git Bash it wrote the integration into the PowerShell
  # $PROFILE — a file the bash session never loads.
  - name: init_git_bash_targets_bash
    description: Init under Git Bash configures bash, not the PowerShell profile
    skip_shellenv: true
    skip_shells: [zsh, fish, powershell, pwsh]
    skip_os: [linux, darwin]
    steps:
      - run: $WT_BIN init --dry-run
        expect:
          exit_code: 0
          output_contains: 'eval "$(wt shellenv bash)"'
      - run: $WT_BIN init --dry-run
        expect:
          output_not_contains: "Invoke-Expression"

  - name: init_creates_config
    description: Init creates shell config with markers
    skip_shellenv: true
    # These four scenarios redirect wt's home lookup at TEST_DIR so they never
    # touch the real ~/.bashrc. That needs bash-only inline env syntax
    # (HOME="..." cmd), which rules out fish and the PowerShell shells — a
    # shell constraint, not an OS one, so they do run under Git Bash. wt reads
    # $HOME on Unix and %USERPROFILE% on Windows, hence both are set.
    skip_shells: [powershell, pwsh, fish]
    steps:
      - run: |
          touch "$TEST_DIR/.bashrc"
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --no-prompt
          cat "$TEST_DIR/.bashrc"
        expect:
          exit_code: 0
          output_contains: "wt initialize"

  - name: init_idempotent
    description: Running init twice does not duplicate config
    skip_shellenv: true
    skip_shells: [powershell, pwsh, fish]
    steps:
      - run: |
          touch "$TEST_DIR/.bashrc"
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --no-prompt
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --no-prompt
          grep -c "wt initialize >>>" "$TEST_DIR/.bashrc"
        expect:
          exit_code: 0
          output_contains: "1"

  - name: init_uninstall
    description: Init --uninstall removes the config
    skip_shellenv: true
    skip_shells: [powershell, pwsh, fish]
    steps:
      - run: |
          touch "$TEST_DIR/.bashrc"
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --no-prompt
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --uninstall --no-prompt
          grep -c "wt initialize" "$TEST_DIR/.bashrc" 2>/dev/null || echo "0"
        expect:
          output_contains: "0"

  - name: init_preserves_existing_content
    description: Init preserves existing shell config content
    skip_shellenv: true
    skip_shells: [powershell, pwsh, fish]
    steps:
      - run: |
          echo "# My existing config" > "$TEST_DIR/.bashrc"
          echo "export MY_VAR=hello" >> "$TEST_DIR/.bashrc"
          HOME="$TEST_DIR" USERPROFILE="$TEST_DIR_NATIVE" $WT_BIN init bash --no-prompt
          cat "$TEST_DIR/.bashrc"
        expect:
          exit_code: 0
          output_contains: "MY_VAR=hello"
