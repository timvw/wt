# E2E tests for environment variable support in template patterns
name: env-vars
description: Test environment variables in worktree patterns

scenarios:
  - name: env_var_in_custom_pattern
    description: Environment variables can be used in custom patterns via {.env.VARNAME}
    steps:
      - run: wt create feature-env
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.MY_WT_TEST_LABEL}/{.repo.Name}/{.branch}"
          MY_WT_TEST_LABEL: custom-label
        expect:
          exit_code: 0
      - run: pwd
        expect:
          cwd_ends_with: /worktrees/custom-label/test-repo/feature-env

  - name: env_var_missing_fails
    description: Missing environment variable in pattern causes an error
    skip_shellenv: true  # Error path: no auto-cd needed
    steps:
      - run: $WT_BIN create feature-missing-env
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.TOTALLY_UNDEFINED_VAR}/{.branch}"
        expect:
          exit_code: 1

  - name: env_var_default_used_when_unset
    description: Default value is used when env var is unset
    steps:
      - run: wt create feature-default
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.UNSET_CATEGORY:-personal}/{.repo.Name}/{.branch}"
        expect:
          exit_code: 0
      - run: pwd
        expect:
          cwd_ends_with: /worktrees/personal/test-repo/feature-default

  - name: env_var_default_ignored_when_set
    description: Default value is ignored when env var is set
    steps:
      - run: wt create feature-setenv
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.MY_CAT:-personal}/{.repo.Name}/{.branch}"
          MY_CAT: work
        expect:
          exit_code: 0
      - run: pwd
        expect:
          cwd_ends_with: /worktrees/work/test-repo/feature-setenv

  - name: env_var_empty_default
    description: Empty default produces an empty segment when var is unset
    skip_shellenv: true
    steps:
      - run: $WT_BIN create feature-empty-def
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.GONE:-}/{.branch}"
        expect:
          exit_code: 0

  - name: env_var_default_with_slash
    description: Default value containing a slash is preserved
    steps:
      - run: wt create feature-slashdef
        env:
          WORKTREE_STRATEGY: custom
          WORKTREE_PATTERN: "{.worktreeRoot}/{.env.NOSUCH:-a/b}/{.branch}"
        expect:
          exit_code: 0
      - run: pwd
        expect:
          cwd_ends_with: /worktrees/a/b/feature-slashdef
