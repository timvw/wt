# GoReleaser configuration for wt
# https://goreleaser.com

version: 2

project_name: wt

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: wt
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/timvw/wt/cmd.Version={{.Version}}
    # Reproducible builds. The release workflow runs GoReleaser twice (core, then
    # best-effort winget), and the second run rebuilds from scratch. Without a
    # pinned timestamp the rebuilt archives hash differently than the ones already
    # uploaded to the release, so the generated winget manifest carries a hash that
    # no published asset matches (Error-Hash-Mismatch on the winget-pkgs PR).
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 is excluded due to limited adoption and testing capability.
      # Can be added later when Windows on ARM becomes more mainstream.
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Pin every archive member's mtime, not just the binary's: the default
    # LICENSE/README globs otherwise carry the checkout time, which differs
    # between the two GoReleaser runs and changes the archive hash.
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE*
        info:
          mtime: '{{ .CommitDate }}'
      - src: README*
        info:
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Linux packages via nfpm
nfpms:
  - package_name: wt
    vendor: timvw
    homepage: https://github.com/timvw/wt
    maintainer: Tim Van Wassenhove <tim@vanwassenhove.be>
    description: A fast, simple Git worktree helper
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/wt/LICENSE
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

# Homebrew tap
brews:
  - repository:
      owner: timvw
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/timvw/wt
    description: Fast, simple Git worktree helper
    license: MIT
    install: |
      bin.install "wt"
    caveats: |
      To enable shell integration (auto-cd after checkout/create), run:
        wt init

      Then restart your shell or run:
        source ~/.zshrc    # for zsh
        source ~/.bashrc   # for bash

      To remove shell integration later:
        wt init --uninstall
    test: |
      assert_match "wt version", shell_output("#{bin}/wt version")

# Scoop bucket for Windows
scoops:
  - repository:
      owner: timvw
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/timvw/wt
    description: A fast, simple Git worktree helper
    license: MIT

# WinGet package (Windows Package Manager)
winget:
  - name: wt
    # Explicit release-asset URL so the winget pipe doesn't depend on the
    # release pipe: the best-effort winget step disables the release upload
    # (WT_WINGET_ONLY=1), which otherwise removes the default url_template and
    # fails with "release is disabled, cannot use default url_template".
    url_template: "https://github.com/timvw/wt/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    publisher: timvw
    publisher_url: https://timvw.be
    publisher_support_url: https://github.com/timvw/wt/issues
    short_description: "A fast, simple Git worktree helper"
    description: |
      wt is a fast, simple Git worktree helper written in Go.
      It wraps Git's native worktree commands with a convenient interface,
      organized directory structure, and shell integration with auto-cd.
    license: MIT
    license_url: https://github.com/timvw/wt/blob/main/LICENSE
    tags:
      - git
      - worktree
      - cli
      - developer-tools
    release_notes_url: "https://github.com/timvw/wt/releases/tag/{{.Tag}}"
    repository:
      owner: timvw
      name: winget-pkgs
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# AUR package
aurs:
  - name: wt-bin
    homepage: https://github.com/timvw/wt
    description: A fast, simple Git worktree helper
    maintainers:
      - 'Tim Van Wassenhove <tim@vanwassenhove.be>'
    license: MIT
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/wt-bin.git'
    package: |-
      install -Dm755 wt "${pkgdir}/usr/bin/wt"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/wt/LICENSE"

release:
  github:
    owner: timvw
    name: wt
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
  # Make re-runs idempotent: if an asset upload gets a 422 (already exists),
  # delete the existing asset and re-upload instead of failing the release.
  # Lets a release be safely re-run after a transient publisher failure (e.g. winget).
  replace_existing_artifacts: true
  # The workflow publishes winget in a separate best-effort step (WT_WINGET_ONLY=1)
  # so its flakiness can't fail the release. In that step, disable the release-upload
  # pipe so we don't churn assets that the main step already published.
  disable: '{{ eq .Env.WT_WINGET_ONLY "1" }}'
